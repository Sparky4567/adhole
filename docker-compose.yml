services:
  adhole:
    build: .
    container_name: adhole
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "3000:3000/tcp"
    environment:
      - DNS_PORT=53
      - HTTP_PORT=3000
      - UPSTREAM_DNS=1.1.1.1,1.0.0.1,8.8.8.8,9.9.9.9
      - BLOCKING_MODE=ZERO_IP
    volumes:
      - ./data:/app/data
